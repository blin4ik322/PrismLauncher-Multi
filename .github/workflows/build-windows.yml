name: Build Windows

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            git
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-extra-cmake-modules
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-qt6-imageformats
            mingw-w64-clang-x86_64-qt6-networkauth
            mingw-w64-clang-x86_64-qt6-svg
            mingw-w64-clang-x86_64-qt6-tools
            mingw-w64-clang-x86_64-cmark
            mingw-w64-clang-x86_64-libarchive
            mingw-w64-clang-x86_64-qrencode
            mingw-w64-clang-x86_64-tomlplusplus
            mingw-w64-clang-x86_64-zlib
      - name: Get upstream and apply patch
        run: |
          git -c core.autocrlf=false clone --branch 10.0.0 --recurse-submodules https://github.com/PrismLauncher/PrismLauncher.git upstream
          cd upstream
          sed -i 's/\r$//' ../patches/PrismLauncher-10.0.0-multi.patch
          git apply --check ../patches/PrismLauncher-10.0.0-multi.patch
          git apply ../patches/PrismLauncher-10.0.0-multi.patch
      - name: Build and install
        run: |
          export JAVA_HOME="$(cygpath -m "$JAVA_HOME")"
          cmake -S upstream -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$(cygpath -m /clang64)" \
            -DCMAKE_INSTALL_PREFIX="$(cygpath -m "$PWD/dist/PrismLauncher")" \
            -DBUILD_TESTING=OFF \
            -DLauncher_BUILD_PLATFORM=windows \
            -DLauncher_UPDATER_GITHUB_REPO= \
            -DLauncher_BUILD_ARTIFACT=Windows-MinGW-w64-Qt \
            -DLauncher_IMGUR_CLIENT_ID= \
            -DLauncher_CURSEFORGE_API_KEY= \
            -DLauncher_MSA_CLIENT_ID=
          cmake --build build --parallel 4
          cmake --install build
          mkdir -p dist/PrismLauncher/tls
          cp /clang64/share/qt6/plugins/tls/qopensslbackend.dll dist/PrismLauncher/tls/
          cp /clang64/bin/libssl-3-x64.dll /clang64/bin/libcrypto-3-x64.dll dist/PrismLauncher/
          cp LICENSE dist/PrismLauncher/
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/PrismLauncher -DestinationPath PrismLauncher-Multi-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PrismLauncher-Multi-Windows
          path: PrismLauncher-Multi-Windows.zip
      - name: Attach ZIP to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: PrismLauncher-Multi-Windows.zip
